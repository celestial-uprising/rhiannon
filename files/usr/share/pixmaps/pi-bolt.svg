<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Punchy neon cyan-to-magenta gradient -->
    <linearGradient id="neonGrad" x1="12%" y1="12%" x2="88%" y2="88%">
      <stop offset="0%" stop-color="#00f7ff" />
      <stop offset="38%" stop-color="#22a6ff" />
      <stop offset="72%" stop-color="#b537f2" />
      <stop offset="100%" stop-color="#ff1e7a" />
    </linearGradient>

    <!-- High-contrast gradient for the pi symbol & lightning bolt -->
    <linearGradient id="piGrad" x1="20%" y1="15%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#18ffff" />
      <stop offset="45%" stop-color="#309eff" />
      <stop offset="78%" stop-color="#a838f5" />
      <stop offset="100%" stop-color="#ff1a75" />
    </linearGradient>

    <!-- Deeper shadow for stronger separation from the bolt -->
    <linearGradient id="shadowGrad" x1="15%" y1="15%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#091324" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#1e0b36" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#3b0724" stop-opacity="0.95" />
    </linearGradient>

    <!-- Subtle neon glow filter that still reads cleanly at small sizes -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Inset mechanical gear/reticle node (cyan) -->
    <g id="mechNodeCyan">
      <!-- Dark recessed socket plate -->
      <polygon points="-28,-28 28,-28 36,0 28,28 -28,28 -36,0" fill="#040c17" stroke="#0c263d" stroke-width="4" />
      <!-- Jagged mechanical teeth -->
      <polygon points="-7,-34 7,-34 10,-23 19,-19 29,-25 38,-16 32,-6 35,3 46,7 46,21 35,25 32,34 38,44 29,53 19,47 10,51 7,62 -7,62 -10,51 -19,47 -29,53 -38,44 -32,34 -35,25 -46,21 -46,7 -35,3 -32,-6 -38,-16 -29,-25 -19,-19 -10,-23" transform="translate(0, -14) scale(0.76)" fill="#071526" stroke="#00f7ff" stroke-width="5" stroke-linejoin="miter" />
      <!-- Inset diamond core -->
      <polygon points="0,-13 13,0 0,13 -13,0" fill="#00f7ff" />
      <circle cx="0" cy="0" r="4.5" fill="#040c17" />
    </g>

    <!-- Inset mechanical gear/reticle node (pink) -->
    <g id="mechNodePink">
      <!-- Dark recessed socket plate -->
      <polygon points="-28,-28 28,-28 36,0 28,28 -28,28 -36,0" fill="#140412" stroke="#360929" stroke-width="4" />
      <!-- Jagged mechanical teeth -->
      <polygon points="-7,-34 7,-34 10,-23 19,-19 29,-25 38,-16 32,-6 35,3 46,7 46,21 35,25 32,34 38,44 29,53 19,47 10,51 7,62 -7,62 -10,51 -19,47 -29,53 -38,44 -32,34 -35,25 -46,21 -46,7 -35,3 -32,-6 -38,-16 -29,-25 -19,-19 -10,-23" transform="translate(0, -14) scale(0.76)" fill="#1e071c" stroke="#ff1e7a" stroke-width="5" stroke-linejoin="miter" />
      <!-- Inset diamond core -->
      <polygon points="0,-13 13,0 0,13 -13,0" fill="#ff1e7a" />
      <circle cx="0" cy="0" r="4.5" fill="#140412" />
    </g>
  </defs>

  <!-- Outer Hexagon Frame -->
  <polygon points="500,45 894,272.5 894,727.5 500,955 106,727.5 106,272.5" fill="none" stroke="url(#neonGrad)" stroke-width="40" stroke-linejoin="round" filter="url(#neonGlow)" />

  <!-- Crisp Inner Tech Frame -->
  <polygon points="500,98 848,299 848,701 500,902 152,701 152,299" fill="none" stroke="#13293d" stroke-width="8" stroke-linejoin="round" />

  <!-- Four Inset Mechanical Nodes (pulled inward along the hex diagonals) -->
  <use href="#mechNodeCyan" x="500" y="185" filter="url(#neonGlow)" />
  <use href="#mechNodeCyan" x="225" y="352" filter="url(#neonGlow)" />
  <use href="#mechNodePink" x="775" y="648" filter="url(#neonGlow)" />
  <use href="#mechNodePink" x="500" y="815" filter="url(#neonGlow)" />

  <!-- Shadow Layer (Offset for crisp 3D depth) -->
  <g transform="translate(36, 38)">
    <polygon points="855,135 450,490 545,490 195,915 605,530 505,530" fill="url(#shadowGrad)" />
    <path d="M 320,250 L 775,250 L 745,328 L 642,328 L 642,645 C 642,685 660,698 690,698 C 712,698 730,685 745,665 L 785,712 C 755,752 715,772 668,772 C 595,772 562,725 562,645 L 562,328 L 435,328 L 402,718 C 398,755 375,772 345,772 C 318,772 300,752 304,715 L 342,328 L 315,328 C 282,328 265,345 258,378 L 200,378 C 208,295 248,250 320,250 Z" fill="url(#shadowGrad)" />
  </g>

  <!-- Main Foreground Lightning Bolt -->
  <polygon points="835,120 430,475 525,475 165,915 585,515 485,515" fill="url(#piGrad)" filter="url(#neonGlow)" />

  <!-- Main Foreground Pi (π) Symbol -->
  <path d="M 320,250 L 775,250 L 745,328 L 642,328 L 642,645 C 642,685 660,698 690,698 C 712,698 730,685 745,665 L 785,712 C 755,752 715,772 668,772 C 595,772 562,725 562,645 L 562,328 L 435,328 L 402,718 C 398,755 375,772 345,772 C 318,772 300,752 304,715 L 342,328 L 315,328 C 282,328 265,345 258,378 L 200,378 C 208,295 248,250 320,250 Z" fill="url(#piGrad)" filter="url(#neonGlow)" />
</svg>